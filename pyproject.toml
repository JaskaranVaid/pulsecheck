[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsecheck"
version = "0.1.0"
description = "Detecting deepfakes by checking for a real heartbeat (rPPG) in facial video"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jaskaran Vaid" }]
dependencies = [
    "mediapipe>=1.1,<2",
    "numpy>=2",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pulsecheck = "pulsecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
